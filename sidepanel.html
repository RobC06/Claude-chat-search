<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Chat Search</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1>Claude Chat Search</h1>
      <div class="toolbar">
        <button id="syncBtn" title="Download your chats from Claude.ai">
          Sync chats
        </button>
        <span id="count" class="count"></span>
      </div>
      <div id="status" class="status hidden"></div>
      <div id="progressWrap" class="progress-wrap hidden">
        <div id="progressBar" class="progress-bar"></div>
      </div>
    </header>

    <div class="search-box">
      <input
        id="searchInput"
        type="search"
        placeholder="Search your chats…"
        autocomplete="off"
      />
    </div>

    <div id="results" class="results">
      <p class="empty" id="emptyState">
        Click <strong>Sync chats</strong> above to download your conversations,
        then start typing to search.
      </p>
    </div>

    <!-- Load the database helper first, then the panel logic. -->
    <script src="db.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
